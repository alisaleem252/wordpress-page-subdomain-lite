name: Sync trunk to WordPress.org

# Every push to main updates SVN trunk (development copy).
# Users only receive a new version when a release tag is pushed (see deploy.yml).
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.wordpress-org/**'
      - 'README.md'

concurrency:
  group: wporg-svn
  cancel-in-progress: false

jobs:
  trunk:
    name: Update SVN trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion rsync

      - name: Check out SVN trunk
        run: svn checkout --quiet "https://plugins.svn.wordpress.org/page-as-subdomain-lite/trunk" "$RUNNER_TEMP/trunk"

      - name: Copy repo files into trunk
        run: rsync -rc --delete --exclude='.svn' --exclude-from=.distignore ./ "$RUNNER_TEMP/trunk/"

      - name: Commit changes
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP/trunk"
          svn add --force --quiet .
          svn status | grep '^!' | sed 's/^! *//' | xargs -r -d '\n' svn rm --quiet
          if [ -z "$(svn status)" ]; then
            echo "Trunk already up to date."
            exit 0
          fi
          svn status
          svn commit -m "Sync trunk from GitHub ${GITHUB_SHA::7}" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache
